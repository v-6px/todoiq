org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# The pub cache lives on C: while this project lives on E:. Kotlin's incremental
# compiler relativizes plugin sources against the project root, and File.relativeTo
# throws across Windows drive roots ("this and base files have different roots"),
# failing :shared_preferences_android:compileDebugKotlin. Full (non-incremental)
# Kotlin compilation avoids that path entirely.
kotlin.incremental=false
