name: todo_list
description: "ToDoIQ — local-first smart to-do app with offline alarms and BYOK AI debriefing."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.1+2

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # Arabic/English UI: Material + Cupertino strings and text direction.
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Phase 1 — local storage
  sqflite: ^2.4.1
  path: ^1.9.0
  shared_preferences: ^2.3.5

  # Phase 2 — offline alarms
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Phase 4/5 — BYOK AI calls and report rendering
  http: ^1.3.0
  intl: ^0.20.2
  flutter_markdown: ^0.7.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Runs the real SQLite engine on the host so the database layer can be
  # verified with `flutter test`, without an emulator.
  sqflite_common_ffi: ^2.3.4

  flutter_lints: ^6.0.0

  # Generates the Android launcher icons; see the config at the end of this
  # file. Only ever run by hand, never at build time.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  fonts:
    # Converted from the supplied thmanyah-sans-Regular.woff2 — Flutter loads
    # TTF/OTF only. The family ships a single Regular weight, so heavier
    # tokens render at 400 rather than synthesising a bold.
    - family: Thmanyah
      fonts:
        - asset: assets/fonts/Thmanyah-Regular.otf
          weight: 400

# Launcher icons, regenerated with `dart run flutter_launcher_icons`.
#
# Two sources rather than one: an adaptive icon masks away the outer third of
# its foreground, and the ToDoIQ wordmark spans most of the logo's width, so
# the foreground is supplied pre-scaled into the safe zone. The background is
# the logo's own #101010, so the round icon still reads as the square one.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/todoiq_icon.png"
  adaptive_icon_background: "#101010"
  adaptive_icon_foreground: "assets/icon/todoiq_foreground.png"
  adaptive_icon_monochrome: "assets/icon/todoiq_foreground.png"
  min_sdk_android: 21
